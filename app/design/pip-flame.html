<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pip flame · trailing circles</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; font: 14px/1.35 -apple-system, system-ui, "Helvetica Neue", sans-serif; user-select: none; -webkit-user-select: none; }
  body { background: #f2f3f6; color: #16181f; }
  body.dark { background: #1b1d2a; color: #fff; }
  #stage { position: absolute; inset: 0; touch-action: none; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #glow { filter: blur(var(--glow, 24px)); opacity: var(--glowA, .6); }
  #core { filter: blur(var(--soft, 0px)); }
  #panel { position: absolute; right: 16px; top: 16px; width: 290px; padding: 14px 16px; border-radius: 22px;
           background: rgba(255,255,255,.85); color: #16181f; box-shadow: 0 4px 20px rgba(0,0,0,.08); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
  #panel h1 { margin: 0 0 4px; font-size: 17px; } #panel p { margin: 0 0 10px; color: #666; font-size: 12.5px; }
  .row { display: flex; justify-content: space-between; color: #555; font-size: 12px; margin-top: 8px; }
  input[type=range] { width: 100%; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  button { font: inherit; font-size: 13px; font-weight: 600; border: 0; border-radius: 11px; padding: 7px 11px; background: #eceef3; color: #16181f; cursor: pointer; }
  button.on { background: #16181f; color: #fff; }
  #tiny { display: flex; gap: 12px; align-items: flex-end; margin-top: 10px; padding: 8px; background: #fff; border-radius: 12px; }
  #tiny canvas { display: block; }
  #tiny small { display: block; text-align: center; color: #999; font-size: 10px; }
  #panel.folded > :not(h1):not(.seg.top) { display: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="glow"></canvas><canvas id="core"></canvas><canvas id="face"></canvas></div>
<div id="panel">
  <h1>🔥 Pip · trailing circles</h1>
  <div class="seg top"><button id="foldBtn">Hide</button><button id="autoBtn" class="on">Fly by itself</button></div>
  <p>A centre circle with smaller circles trailing behind, all blended into one shape. When Pip moves, the trail curves like a flame. Drag anywhere to lead Pip.</p>
  <div class="seg" id="views"><button data-v="sil" class="on">◼ Silhouette</button><button data-v="fairy">🧚 Fairy glow</button><button data-v="pearl">Pearl</button><button data-v="build">Build</button></div>
  <div class="row"><span>Trail circles</span><span id="nv"></span></div><input type="range" id="n" min="2" max="12" step="1" value="6">
  <div class="row"><span>Taper</span><span id="tv"></span></div><input type="range" id="taper" min="0.6" max="2.4" step="0.05" value="1.0">
  <div class="row"><span>Rise (flame goes up)</span><span id="rv"></span></div><input type="range" id="rise" min="0" max="1" step="0.05" value="0.55">
  <div class="row"><span>Lag (how much it trails)</span><span id="lv"></span></div><input type="range" id="lag" min="0.05" max="0.6" step="0.01" value="0.22">
  <div class="row"><span>Feather</span><span id="fv"></span></div><input type="range" id="feather" min="0" max="12" step="0.5" value="0">
  <div class="seg"><button id="wingBtn">🪽 Wings (trailing too)</button></div>
  <div id="tiny"></div>
</div>
<script>
// Pip as trailing, blending circles (Aaron, 31 Oct: "think of it like trailing blending circles from the centre, like a
// fire… curves as it moves… the wings should be like this also"). One centre circle; a chain of smaller circles
// follows it, each one easing after the one before, rising a little like a flame when Pip is still. Each circle is
// wrapped together with the next (tangent lines), so the chain reads as one smooth shape that bends as Pip moves.
// Wings: two short chains from the sides, trailing the same way. Silhouette first; the glow is a separate, blurred
// layer (CSS blur, so it works in Safari on the iPad). Nothing here goes into the app until Aaron agrees the shape.

const $ = s => document.querySelector(s);
const cvs = { glow: $('#glow'), core: $('#core'), face: $('#face') };
const ctx = Object.fromEntries(Object.entries(cvs).map(([k, c]) => [k, c.getContext('2d')]));
let W = 0, H = 0, DPR = Math.min(2, devicePixelRatio || 1);
function resize() {
  W = innerWidth; H = innerHeight;
  for (const c of Object.values(cvs)) { c.width = W * DPR; c.height = H * DPR; }
  for (const x of Object.values(ctx)) x.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

// ── Settings
const P = { n: 6, taper: 1.0, rise: .55, lag: .22, feather: 0, view: 'sil', wings: false, auto: true };
const R = () => Math.min(W, H) * .085;     // the centre circle
const TONES = {
  sil:   { fill: '#16181f', glow: '#16181f', eye: '#fff', bg: '' },
  build: { fill: '#16181f', glow: '#16181f', eye: '#fff', bg: '' },
  fairy: { fill: ['#ffffff', '#bccdf6', '#4165be'], glow: '#4f7be8', eye: '#16181f', bg: 'dark' },
  pearl: { fill: ['#ffffff', '#eceef3', '#a9b0bf'], glow: '#c9d1e6', eye: '#16181f', bg: 'dark' },
};

// ── The chain
let head = { x: W * .4, y: H * .55 }, target = { ...head };
let tail = [], wingL = [], wingR = [];
function reset() {
  tail = Array.from({ length: 12 }, (_, i) => ({ x: head.x, y: head.y - i * 10 }));
  wingL = Array.from({ length: 5 }, () => ({ ...head })); wingR = Array.from({ length: 5 }, () => ({ ...head }));
}
reset();

/** Each link eases towards a spot one gap behind the link before it, rising a little like a flame. */
function follow(chain, root, gap, lag, up, side = 0, flap = 0) {
  let prev = root;
  for (let i = 0; i < chain.length; i++) {
    const c = chain[i];
    let dx = c.x - prev.x, dy = c.y - prev.y, d = Math.hypot(dx, dy) || 1;
    dx /= d; dy /= d;
    // the resting direction: up (a flame), or out to the side and up (a wing), plus a flap
    const ax = side * Math.cos(flap) * .9, ay = -1 + Math.abs(side) * (.35 + Math.sin(flap) * .5);
    const al = Math.hypot(ax, ay) || 1;
    dx = dx * (1 - up) + ax / al * up; dy = dy * (1 - up) + ay / al * up;
    const dl = Math.hypot(dx, dy) || 1;
    const tx = prev.x + dx / dl * gap, ty = prev.y + dy / dl * gap;
    c.x += (tx - c.x) * (1 - lag); c.y += (ty - c.y) * (1 - lag);
    prev = c;
  }
}

function radii(n, r0, taper, end = .08) {
  return Array.from({ length: n }, (_, i) => r0 * Math.max(end, Math.pow(1 - (i + 1) / (n + 1), taper)));
}

// ── Shape: every circle wrapped with the next one, all filled together
function capsule(path, a, ra, b, rb) {
  const d = Math.hypot(b.x - a.x, b.y - a.y);
  if (d < Math.abs(ra - rb) + .01) { const [c, r] = ra > rb ? [a, ra] : [b, rb]; path.moveTo(c.x + r, c.y); path.arc(c.x, c.y, r, 0, Math.PI * 2); return; }
  const th = Math.atan2(b.y - a.y, b.x - a.x), ph = Math.acos(Math.max(-1, Math.min(1, (ra - rb) / d)));
  path.moveTo(a.x + ra * Math.cos(th + ph), a.y + ra * Math.sin(th + ph));
  path.arc(a.x, a.y, ra, th + ph, th - ph + Math.PI * 2, false);
  path.lineTo(b.x + rb * Math.cos(th - ph), b.y + rb * Math.sin(th - ph));
  path.arc(b.x, b.y, rb, th - ph, th + ph, false);
  path.closePath();
}
function shapePath() {
  const p = new Path2D(), r0 = R();
  p.moveTo(head.x + r0, head.y); p.arc(head.x, head.y, r0, 0, Math.PI * 2);
  const chains = [[tail.slice(0, P.n), radii(P.n, r0 * .92, P.taper)]];
  if (P.wings) for (const w of [wingL, wingR]) chains.push([w, radii(w.length, r0 * .34, .9, .2), true]);
  for (const [chain, rs, wing] of chains) {
    let prev = wing ? wingRoot(chain === wingL ? -1 : 1) : head, pr = wing ? r0 * .34 : r0;
    chain.forEach((c, i) => { const q = new Path2D(); capsule(q, prev, pr, c, rs[i]); p.addPath(q); prev = c; pr = rs[i]; });
  }
  return p;
}
function wingRoot(side) { const r0 = R(); return { x: head.x + side * r0 * .62, y: head.y - r0 * .45 }; }

// ── Drawing
function draw() {
  const tone = TONES[P.view];
  document.body.classList.toggle('dark', tone.bg === 'dark');
  for (const x of Object.values(ctx)) x.clearRect(0, 0, W, H);
  const path = shapePath(), r0 = R();
  const fillFor = c => {
    const f = tone.fill; if (typeof f === 'string') return f;
    const g = c.createRadialGradient(head.x - r0 * .3, head.y - r0 * .4, r0 * .1, head.x, head.y, r0 * 2.6);
    g.addColorStop(0, f[0]); g.addColorStop(.45, f[1]); g.addColorStop(1, f[2]); return g;
  };
  if (P.view === 'fairy' || P.view === 'pearl' || P.feather > 0) { ctx.glow.fillStyle = tone.glow; ctx.glow.fill(path, 'nonzero'); }
  ctx.core.fillStyle = fillFor(ctx.core); ctx.core.fill(path, 'nonzero');
  if (P.view === 'build') {
    const c = ctx.face; c.strokeStyle = 'rgba(79,123,232,.9)'; c.lineWidth = 1.2; c.setLineDash([4, 4]);
    const all = [[head, r0], ...tail.slice(0, P.n).map((t, i) => [t, radii(P.n, r0 * .92, P.taper)[i]])];
    for (const [q, r] of all) { c.beginPath(); c.arc(q.x, q.y, r, 0, Math.PI * 2); c.stroke(); }
    c.setLineDash([]);
  }
  // eyes: crisp, looking where Pip is going
  const vx = target.x - head.x, vy = target.y - head.y, vl = Math.hypot(vx, vy) || 1, look = Math.min(1, vl / 80);
  const ex = vx / vl * r0 * .12 * look, ey = vy / vl * r0 * .1 * look;
  ctx.face.fillStyle = tone.eye;
  for (const s of [-1, 1]) { ctx.face.beginPath(); ctx.face.ellipse(head.x + s * r0 * .3 + ex, head.y + r0 * .05 + ey, r0 * .09, r0 * .15, 0, 0, Math.PI * 2); ctx.face.fill(); }
  document.documentElement.style.setProperty('--soft', (P.feather * .5) + 'px');
  document.documentElement.style.setProperty('--glow', (14 + P.feather * 3) + 'px');
  document.documentElement.style.setProperty('--glowA', P.view === 'fairy' || P.view === 'pearl' ? .7 : P.feather > 0 ? .35 : 0);
  drawTiny(path);
}

// ── Tiny check (always): the same frame, shrunk
const tinyBox = $('#tiny'), tinies = [16, 24, 32, 48].map(px => {
  const d = document.createElement('div'), c = document.createElement('canvas');
  c.width = c.height = px * 2; c.style.width = c.style.height = px + 'px';
  d.appendChild(c); d.insertAdjacentHTML('beforeend', `<small>${px}</small>`); tinyBox.appendChild(d); return [c, px];
});
let tinyT = 0;
function drawTiny(path) {
  if (performance.now() - tinyT < 120) return; tinyT = performance.now();
  const r0 = R(), span = r0 * 5.2;
  for (const [c, px] of tinies) {
    const x = c.getContext('2d'); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, c.width, c.height);
    const k = c.width / span; x.setTransform(k, 0, 0, k, -(head.x - span / 2) * k, -(head.y - span * .38) * k);
    x.fillStyle = '#16181f'; x.fill(path, 'nonzero');
    x.fillStyle = '#fff'; for (const s of [-1, 1]) { x.beginPath(); x.ellipse(head.x + s * r0 * .3, head.y + r0 * .05, r0 * .11, r0 * .17, 0, 0, Math.PI * 2); x.fill(); }
  }
}

// ── Motion
let t0 = performance.now(), dragging = false;
function tick(now) {
  const t = (now - t0) / 1000;
  if (P.auto && !dragging) {   // a slow loop with a pause, so you see it settle into a flame too
    const k = t * .45, still = (Math.sin(t * .35) > .55);
    if (!still) target = { x: W * .42 + Math.sin(k) * W * .24, y: H * .55 + Math.sin(k * 2) * H * .16 };
  }
  head.x += (target.x - head.x) * .08; head.y += (target.y - head.y) * .08;
  const r0 = R();
  follow(tail, head, r0 * .42, P.lag, P.rise * .35 + .02);
  if (P.wings) {
    const flap = Math.sin(t * 7) * .7;
    follow(wingL, wingRoot(-1), r0 * .32, P.lag * .8, .6, -1, flap);
    follow(wingR, wingRoot(1), r0 * .32, P.lag * .8, .6, 1, flap);
  }
  draw();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const stage = $('#stage');
stage.addEventListener('pointerdown', e => { dragging = true; target = { x: e.clientX, y: e.clientY }; stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e => { if (dragging) target = { x: e.clientX, y: e.clientY }; });
addEventListener('pointerup', () => { dragging = false; });

// ── Controls
const bind = (id, key, out, fmt = v => v) => { const el = $('#' + id); const show = () => $('#' + out).textContent = fmt(P[key]); el.value = P[key];
  el.oninput = () => { P[key] = +el.value; show(); }; show(); };
bind('n', 'n', 'nv'); bind('taper', 'taper', 'tv'); bind('rise', 'rise', 'rv', v => Math.round(v * 100) + '%');
bind('lag', 'lag', 'lv', v => v.toFixed(2)); bind('feather', 'feather', 'fv');
document.querySelectorAll('#views button').forEach(b => b.onclick = () => { P.view = b.dataset.v; document.querySelectorAll('#views button').forEach(x => x.classList.toggle('on', x === b)); });
$('#wingBtn').onclick = e => { P.wings = !P.wings; e.target.classList.toggle('on', P.wings); wingL.forEach(c => Object.assign(c, head)); wingR.forEach(c => Object.assign(c, head)); };
$('#autoBtn').onclick = e => { P.auto = !P.auto; e.target.classList.toggle('on', P.auto); };
$('#foldBtn').onclick = e => { $('#panel').classList.toggle('folded'); e.target.textContent = $('#panel').classList.contains('folded') ? 'Show' : 'Hide'; };
window.__flame = { P, set: o => Object.assign(P, o), at: (x, y) => { target = { x, y }; } };
</script>
</body>
</html>
