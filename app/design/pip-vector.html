<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pip · vector (2.5D)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(#1d5f86, #123e66);
    font: 14px/1.35 -apple-system, system-ui, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .bar { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  button { background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 12px;
    min-height: 44px; padding: 0 14px; font: inherit; font-size: 18px; }
  .note { position: absolute; left: 12px; top: 10px; opacity: .75; max-width: 520px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="note">Pip in vectors (2.5D): his circles live in 3D and are redrawn every frame, lit by painted-on light
that never moves. Drag him. Tap an emoji.</div>
<div class="bar" id="bar"></div>
<script>
// Vector Pip, 2.5D (Aaron, 1 Nov: "drawing him in vectors and adding the effects over the vectors … keeping the
// lighting as a mock effect … feel like he's moving in space … simplify it like a video game").
// Same skeleton as the 3D page (app/design/pip-3d.html, Aaron's final settings): a head with ten trailing circles
// joined by tangent lines, two leaf wings from the crown. Each frame: the skeleton in 3D → projected → drawn as flat
// shapes. Lighting is painted: a fixed light from the top left (it never flips), a rim, a soft inner glow.
// This file is the model for the app's version (PipBlobbyLook.swift): keep the two in step.

// ---------- picks (Aaron's final settings, 1 Nov)
const PICK = { n: 10, len: 2.65, curl: .3, taper: 1.2, slope: .32, wings: [[1, 62, 2.8], [-1, 44, 3.3]],
  stops: [0, .25, .5, .76, 1], widths: [.07, .34, .4, .26, .03], rest: 45, side: 70, cam: 8 };

// ---------- 3D maths
const v3 = (x = 0, y = 0, z = 0) => ({ x, y, z });
const add = (a, b, k = 1) => v3(a.x + b.x * k, a.y + b.y * k, a.z + b.z * k);
const sc = (a, k) => v3(a.x * k, a.y * k, a.z * k);
const norm = v => { const l = Math.hypot(v.x, v.y, v.z) || 1; return v3(v.x / l, v.y / l, v.z / l); };
const cross = (a, b) => v3(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);
const turnAbout = (v, ax, ang) => { const c = Math.cos(ang), s = Math.sin(ang), d = v.x * ax.x + v.y * ax.y + v.z * ax.z, x = cross(ax, v);
  return v3(v.x * c + x.x * s + ax.x * d * (1 - c), v.y * c + x.y * s + ax.y * d * (1 - c), v.z * c + x.z * s + ax.z * d * (1 - c)); };

// ---------- the rig: state that carries over between frames (turning, the tail's lag)
const rig = { yaw: PICK.rest, yawV: 0, tail: null, last: null, speedX: 0, vx: 0, vy: 0, phase: 0, effort: 0 };

/** One frame of Pip. pos: where his head is (px); R: head radius (px); target: which way he wants to face
 *  (-1 left, 0 you, 1 right); emote: 0…1 how much an emoji face is on (he looks at you). Returns what to draw. */
function step(pos, R, t, dt, target, emote) {
  // facing: a springy turn (weight), towards the way he's moving, else his three-quarter rest
  if (rig.last && dt > 0) {
    const vx = (pos.x - rig.last.x) / dt, vy = (pos.y - rig.last.y) / dt;
    rig.vx += (vx - rig.vx) * Math.min(1, dt * 10); rig.vy += (vy - rig.vy) * Math.min(1, dt * 10);
  }
  rig.last = { x: pos.x, y: pos.y };
  const moving = Math.abs(rig.vx) > 40 ? Math.sign(rig.vx) : 0;
  const side = moving || target || Math.sign(rig.yaw) || 1;
  let want = side * (moving ? PICK.side : PICK.rest);
  want = want * (1 - emote);                                            // an emoji face: he turns to you
  const k = 60, damp = 11;                                              // a soft spring: he swings round, settles
  rig.yawV += ((want - rig.yaw) * k - rig.yawV * damp) * dt;
  rig.yaw += rig.yawV * dt;

  const a = rig.yaw * Math.PI / 180;
  const tilt = Math.max(-.35, Math.min(.35, rig.vy / 1400));            // nose up or down as he climbs or dives
  const face = norm(v3(Math.sin(a), -.05 - tilt, Math.cos(a)));
  const sideV = norm(cross(v3(0, 1, 0), face)), up = norm(cross(face, sideV));

  // the tail: circles held behind and below the head, curled, and lagging behind his movement (liquid weight)
  // effort (Aaron: "mimic weight and effort in his wing flap"): flying is work, climbing is hard work. The beat
  // gets bigger and slower as he climbs; each down-stroke lifts him a little and he sinks between beats.
  const flying = Math.min(1, Math.hypot(rig.vx, rig.vy) / 120);
  const climbing = Math.max(0, Math.min(1, -rig.vy / 260));
  rig.effort += (Math.max(flying * .5, climbing) - rig.effort) * Math.min(1, dt * 4);
  const beat = (4.5 + 4.5 * flying) * (1 - .35 * climbing);
  rig.phase += beat * dt;
  const lift = -Math.sin(rig.phase) * R * (.03 + .09 * rig.effort);
  rig.flap = { amp: .2 + .3 * flying + .3 * climbing };
  const head = v3(pos.x / R, -(pos.y + lift) / R, 0);
  if (!rig.tail) rig.tail = Array.from({ length: PICK.n }, (_, i) => add(head, v3(-(i + 1) * .26, -(i + 1) * .08, -(i + 1) * .1)));
  const back = norm(v3(-face.x, -face.y - PICK.slope, -face.z));
  const gap = PICK.len / PICK.n;
  let prev = head;
  for (let i = 0; i < PICK.n; i++) {
    // facing you, the tail peeks out underneath with a tiny wag (Aaron)
    const front = Math.max(0, Math.cos(rig.yaw * Math.PI / 180) - .5) * 2;
    const wag = front * Math.sin(t * 2.4 - i * .5) * .12 * (i + 1) / PICK.n;
    const c = rig.tail[i], rest = norm(add(turnAbout(back, sideV, -PICK.curl * .9 * (i + 1) / PICK.n), sideV, wag));
    let d = norm(v3(c.x - prev.x, c.y - prev.y, c.z - prev.z));
    d = norm(add(sc(d, .15), rest, .85));
    const goal = add(prev, d, gap), lag = Math.pow(.1, dt * 60);
    c.x += (goal.x - c.x) * (1 - lag); c.y += (goal.y - c.y) * (1 - lag); c.z += (goal.z - c.z) * (1 - lag);
    prev = c;
  }
  const radii = rig.tail.map((_, i) => Math.max(.06, Math.pow(1 - (i + 1) / (PICK.n + 1), PICK.taper)));

  // wings: two leaves from the crown, flapping together (Aaron's overlay: 62° and 44°)
  const wings = PICK.wings.map(([sd, deg, len]) => {
    const backV = sc(face, -1), crown = add(add(head, up, .93), face, -.12), root = add(crown, sideV, sd * .3);              // apart at the root, so they never cross
    const sweep = Math.min(.35, Math.abs(rig.vx) / R * .02);
    const pitch = deg * Math.PI / 180 - sweep;
    const dir = norm(add(add(sc(backV, Math.cos(pitch)), up, Math.sin(pitch)), sideV, sd * .42));   // splayed outwards
    const nrm = norm(cross(dir, backV));
    const amp = rig.flap.amp;
    const pts = [[root, PICK.widths[0]]];
    for (let j = 1; j < 5; j++) {
      const st = PICK.stops[j];
      const flutter = amp * (Math.sin(rig.phase - st * .9 + (sd > 0 ? 0 : .3)) * .8 + .2);
      let seg = turnAbout(dir, nrm, .28 * st - .14);
      seg = norm(turnAbout(seg, backV, sd * flutter));
      const tall = 1 + .15 * Math.max(0, Math.cos(rig.yaw * Math.PI / 180));          // a touch taller seen from the front
      pts.push([add(pts[j - 1][0], seg, len * tall * (st - PICK.stops[j - 1])), PICK.widths[j]]);
    }
    return { pts, nrm };
  });
  return { head, face, sideV, up, radii, wings };
}

// ---------- projection: a simple camera, PICK.cam head-radii away
function proj(p, origin, R) {
  const s = PICK.cam / (PICK.cam - (p.z - origin.z));
  return { x: origin.x * R + (p.x - origin.x) * R * s, y: -(origin.y * R + (p.y - origin.y) * R * s), s };
}

// ---------- 2D shapes: circles joined by tangent lines (Aaron's hull of circles), all wound the same way
function hull(ctx, a, ra, b, rb) {
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
  ctx.moveTo(a.x + ra, a.y); ctx.arc(a.x, a.y, ra, 0, Math.PI * 2);
  ctx.moveTo(b.x + rb, b.y); ctx.arc(b.x, b.y, rb, 0, Math.PI * 2);
  if (d <= Math.abs(ra - rb) + .01) return;
  const ux = dx / d, uy = dy / d, c = (ra - rb) / d, s = Math.sqrt(Math.max(0, 1 - c * c));
  const n1 = [ux * c - uy * s, uy * c + ux * s], n2 = [ux * c + uy * s, uy * c - ux * s];
  ctx.moveTo(a.x + n2[0] * ra, a.y + n2[1] * ra); ctx.lineTo(b.x + n2[0] * rb, b.y + n2[1] * rb);
  ctx.lineTo(b.x + n1[0] * rb, b.y + n1[1] * rb); ctx.lineTo(a.x + n1[0] * ra, a.y + n1[1] * ra); ctx.closePath();
}

// ---------- drawing (painted light: from the top left, always)
const GLASS = { core: 'rgba(222,220,240,.78)', mid: 'rgba(190,186,216,.74)', edge: 'rgba(150,178,208,.82)',
  rim: 'rgba(205,238,255,.7)', wing: 'rgba(168,214,232,.34)', wingEdge: 'rgba(230,248,255,.55)', eye: '#1b1d30', glow: '255,214,170' };

function drawPip(ctx, pos, R, t, dt, target, emoji, vis) {
  const isFace = /^[\u{1F600}-\u{1F64F}\u{1F910}-\u{1F92F}\u{1F970}-\u{1F97A}\u263A]/u.test(emoji || '');
  const emote = isFace ? vis : 0;                                       // a face emoji: he looks at you
  const f = step(pos, R, t, dt, target, emote);
  const O = f.head;
  const H = proj(O, O, R);
  const tail = f.tail = rig.tail.map((p, i) => ({ ...proj(p, O, R), r: f.radii[i] }));
  const zOf = p => p.z - O.z;

  // the glow, on the room
  const g = ctx.createRadialGradient(H.x, H.y, 0, H.x, H.y, R * 2.3);
  g.addColorStop(0, `rgba(${GLASS.glow},.32)`); g.addColorStop(1, `rgba(${GLASS.glow},0)`);
  ctx.fillStyle = g; ctx.fillRect(H.x - R * 3, H.y - R * 3, R * 6, R * 6);

  const wingPaths = f.wings.map(w => {
    const ps = w.pts.map(([p, r]) => ({ ...proj(p, O, R), r, z: zOf(p) }));
    const thin = Math.max(.6, Math.abs(w.nrm.z));                       // keep some width from the front (Aaron)
    return { ps, thin, z: ps[3].z };
  });
  // each wing is its own silhouette (they flap on their own); the one further back is more see-through (Aaron)
  const backZ = Math.min(...wingPaths.map(w => w.z));
  const drawWing = w => {
    ctx.beginPath();
    for (let j = 1; j < w.ps.length; j++) {
      const a = w.ps[j - 1], b = w.ps[j];
      hull(ctx, a, Math.max(.4, a.r * R * a.s * w.thin), b, Math.max(.4, b.r * R * b.s * w.thin));
    }
    const root = w.ps[0], tip = w.ps[w.ps.length - 1];
    const G = ctx.createLinearGradient(root.x, root.y, tip.x, tip.y);
    G.addColorStop(0, 'rgba(200,232,245,.5)'); G.addColorStop(.6, 'rgba(168,214,232,.34)'); G.addColorStop(1, 'rgba(225,245,255,.5)');
    ctx.save(); ctx.globalAlpha = w.z === backZ ? .55 : 1; ctx.fillStyle = G; ctx.fill('nonzero'); ctx.restore();
  };
  // depth order: wings behind the head first
  wingPaths.filter(w => w.z < 0).forEach(drawWing);

  // the body: one shape (head + tail), filled once, so nothing doubles up
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(H.x + R, H.y); ctx.arc(H.x, H.y, R, 0, Math.PI * 2);
  let prev = { x: H.x, y: H.y, r: R };
  for (const p of tail) { const r = p.r * R * p.s; hull(ctx, prev, prev.r, p, r); prev = { x: p.x, y: p.y, r }; }
  ctx.clip('nonzero');
  // layer: glass tint lit from the top left, fading to nothing at the tail's tip
  const L = ctx.createRadialGradient(H.x - R * .35, H.y - R * .4, R * .1, H.x, H.y, R * 1.05);
  L.addColorStop(0, GLASS.core); L.addColorStop(.6, GLASS.mid); L.addColorStop(1, GLASS.edge);
  ctx.fillStyle = L; ctx.fillRect(H.x - R * 6, H.y - R * 6, R * 12, R * 12);
  const tip = tail[tail.length - 1];
  const F = ctx.createLinearGradient(H.x, H.y, tip.x, tip.y);
  F.addColorStop(0, 'rgba(0,0,0,0)'); F.addColorStop(.35, 'rgba(0,0,0,0)'); F.addColorStop(1, 'rgba(0,0,0,1)');
  ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = F; ctx.fillRect(H.x - R * 6, H.y - R * 6, R * 12, R * 12);
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();

  // the head's glass: rim light round the edge, a warm bounce at the bottom, the highlight (top left, fixed)
  const rim = ctx.createRadialGradient(H.x, H.y, R * .72, H.x, H.y, R);
  rim.addColorStop(0, 'rgba(205,238,255,0)'); rim.addColorStop(1, GLASS.rim);
  ctx.beginPath(); ctx.arc(H.x, H.y, R, 0, Math.PI * 2); ctx.fillStyle = rim; ctx.fill();
  const bounce = ctx.createRadialGradient(H.x + R * .2, H.y + R * .9, 0, H.x + R * .2, H.y + R * .9, R * .8);
  bounce.addColorStop(0, 'rgba(255,236,190,.35)'); bounce.addColorStop(1, 'rgba(255,236,190,0)');
  ctx.save(); ctx.beginPath(); ctx.arc(H.x, H.y, R, 0, Math.PI * 2); ctx.clip(); ctx.fillStyle = bounce;
  ctx.fillRect(H.x - R, H.y - R, R * 2, R * 2); ctx.restore();

  // his face flows into the emoji (Aaron, 1 Nov: "its face does need to go into the emoji"): the emoji grows out of
  // where his face is and settles in the middle of his head; his eyes and smile slide into it and fade. Going, the
  // other way round. The emoji is glass too (Aaron: "the glass emoji makes sense to me"): see glassEmoji().
  const onHead = (s, u) => norm(add(add(f.face, f.sideV, s), f.up, u));
  const e = vis * vis * (3 - 2 * vis);                                   // eased
  const fn = onHead(0, -.38), fp = fn.z > 0 ? proj(add(O, fn), O, R) : H;
  const centre = { x: H.x, y: H.y + R * .06 };
  const into = { x: fp.x + (centre.x - fp.x) * e, y: fp.y + (centre.y - fp.y) * e };
  if (emoji && vis > 0) {
    const size = R * (isFace ? 1.15 : .95) * (.35 + .65 * e) * 1.34;
    ctx.save(); ctx.beginPath(); ctx.arc(H.x, H.y, R * .96, 0, Math.PI * 2); ctx.clip();
    ctx.globalAlpha = Math.min(1, vis * 1.4);
    ctx.drawImage(glassEmoji(emoji), into.x - size / 2, into.y - size / 2, size, size);
    ctx.restore();
  }
  const hl = ctx.createRadialGradient(H.x - R * .4, H.y - R * .45, 0, H.x - R * .4, H.y - R * .45, R * .28);
  hl.addColorStop(0, 'rgba(255,255,255,.95)'); hl.addColorStop(.35, 'rgba(255,255,255,.5)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hl; ctx.fillRect(H.x - R, H.y - R, R * 2, R * 2);

  // face: tall eyes and a small smile, painted onto the sphere where his face points (hidden round the back);
  // while an emoji is in, they slide into it and fade
  const faceOn = emoji ? 1 - e : 1;
  const pull = p => ({ x: p.x + (into.x - p.x) * e * .8, y: p.y + (into.y - p.y) * e * .8 });
  if (faceOn > .02) {
    for (const s of [-.3, .3]) {
      const n = onHead(s, -.32); if (n.z < .05) continue;
      const p = pull(proj(add(O, n), O, R)), k = 1 - e * .6;
      ctx.save(); ctx.globalAlpha = faceOn * Math.min(1, n.z * 4); ctx.translate(p.x, p.y);
      ctx.scale(Math.max(.25, n.z) * k, k); ctx.beginPath(); ctx.ellipse(0, 0, R * .1, R * .155, 0, 0, Math.PI * 2);
      ctx.fillStyle = GLASS.eye; ctx.fill(); ctx.restore();
    }
    const m = onHead(0, -.62);
    if (m.z > .1) {
      const p = pull(proj(add(O, m), O, R)), k = 1 - e * .6;
      ctx.save(); ctx.globalAlpha = faceOn * Math.min(1, m.z * 3); ctx.translate(p.x, p.y); ctx.scale(Math.max(.3, m.z) * k, k);
      ctx.beginPath(); ctx.moveTo(-R * .12, 0); ctx.quadraticCurveTo(0, R * .1, R * .12, 0);
      ctx.lineWidth = R * .05; ctx.lineCap = 'round'; ctx.strokeStyle = GLASS.eye; ctx.stroke(); ctx.restore();
    }
  }
  wingPaths.filter(w => w.z >= 0).forEach(drawWing);
}

// ---------- a glass emoji (Aaron: "here's the glass"): Apple's emoji, a little see-through, a bright edge where the
// light hits (top left, like Pip), a soft dark edge on the other side, a sheen. Made once per emoji, then reused.
const glassCache = {};
function glassEmoji(ch) {
  if (glassCache[ch]) return glassCache[ch];
  const S = 160, mk = () => { const c = document.createElement('canvas'); c.width = c.height = S; return c; };
  const base = mk(), b = base.getContext('2d');
  b.font = '118px "Apple Color Emoji","Noto Color Emoji",sans-serif'; b.textAlign = 'center'; b.textBaseline = 'middle';
  b.fillText(ch, S / 2, S / 2 + 6);
  const sil = col => { const c = mk(), x = c.getContext('2d'); x.drawImage(base, 0, 0); x.globalCompositeOperation = 'source-in';
    x.fillStyle = col; x.fillRect(0, 0, S, S); return c; };
  const edge = (col, dx, dy) => { const c = sil(col), x = c.getContext('2d'), cut = sil('#000');
    x.globalCompositeOperation = 'destination-out';
    for (let k = 1; k <= 5; k++) { x.globalAlpha = .3; x.drawImage(cut, dx * k, dy * k); }
    return c; };
  const out = mk(), o = out.getContext('2d');
  o.globalAlpha = .8; o.drawImage(base, 0, 0); o.globalAlpha = 1;
  o.globalCompositeOperation = 'source-atop';
  o.fillStyle = 'rgba(205,225,255,.14)'; o.fillRect(0, 0, S, S);                       // a touch of Pip's glass colour
  o.globalAlpha = .75; o.drawImage(edge('#fff', 1.4, 1.8), 0, 0);                      // light edge, top left
  o.globalAlpha = .3; o.drawImage(edge('rgb(25,25,70)', -1.4, -1.8), 0, 0);            // dark edge, bottom right
  o.globalAlpha = 1;
  const g = o.createRadialGradient(S * .36, S * .3, 0, S * .36, S * .3, S * .32);       // sheen
  g.addColorStop(0, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  o.fillStyle = g; o.fillRect(0, 0, S, S);
  return glassCache[ch] = out;
}

// ---------- the glass version (Aaron, 1 Nov): silhouette → glass shader → face on top
// 1. A black-and-white silhouette (red: body, green: front wing, blue: back wing), drawn flat each frame.
// 2. Softened (shrunk and grown back), so head and tail flow into each other like soft clay, no corners.
// 3. A glass shader reads it: works out how round he is at each point, bends what's behind (the emoji too, so it's
//    a glass emoji), adds a rim of light, a highlight from the top left (never moves) and a warm bounce underneath.
// 4. His face painted on top (it sinks into the emoji when one comes).
const GL = (() => {
  const c = document.createElement('canvas'); c.id = 'g';
  c.style.cssText = 'position:absolute;left:0;top:0;pointer-events:none';
  document.body.insertBefore(c, document.querySelector('.note'));
  const top = document.createElement('canvas'); top.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none';
  document.body.insertBefore(top, document.querySelector('.note'));
  const gl = c.getContext('webgl', { premultipliedAlpha: true, alpha: true });
  const vs = 'attribute vec2 a; varying vec2 v; void main(){ v = a * .5 + .5; gl_Position = vec4(a, 0., 1.); }';
  const fs = `precision mediump float;
varying vec2 v;
uniform sampler2D tS, tB, tI;
uniform vec2 head, tip, pxS, pxB, scr;
uniform float R;
vec3 bg(float sy){ return mix(vec3(.114,.373,.525), vec3(.071,.243,.4), clamp(sy, 0., 1.)); }
vec3 slope(sampler2D t, vec2 px, vec2 uv, vec3 ch){
  float hx = dot(texture2D(t, uv + vec2(px.x, 0.)).rgb - texture2D(t, uv - vec2(px.x, 0.)).rgb, ch);
  float hy = dot(texture2D(t, uv + vec2(0., px.y)).rgb - texture2D(t, uv - vec2(0., px.y)).rgb, ch);
  return normalize(vec3(-hx * 2.5, -hy * 2.5, 1.));
}
vec4 glassAt(vec3 n, float a, vec2 off, bool body){
  float sy = mix(scr.x, scr.y, 1. - (v.y + off.y));
  vec3 col = bg(sy);                                                // what's behind him, bent
  if (body) { vec4 em = texture2D(tI, v + off * 1.3); col = col * (1. - em.a) + em.rgb; }   // the emoji, bent too
  col = mix(col, vec3(.87, .86, .95), (body ? .2 : .3) + .25 * (1. - n.z));                 // his glass colour
  float fr = pow(1. - n.z, 2.2);
  col += vec3(.8, .93, 1.) * fr * .6;                               // rim light
  vec3 L = normalize(vec3(-.55, .6, .6));
  col += pow(max(dot(reflect(-L, n), vec3(0., 0., 1.)), 0.), 22.) * .75;   // highlight, top left, always (soft, Aaron)
  col += vec3(1., .93, .75) * max(-n.y, 0.) * fr * .45;             // warm bounce underneath
  return vec4(col * a, a);
}
void main(){
  vec3 s = texture2D(tS, v).rgb;
  float body = smoothstep(.36, .6, s.r), fw = smoothstep(.22, .5, s.g), bw = smoothstep(.22, .5, s.b);
  vec3 n = slope(tB, pxB, v, vec3(1., 0., 0.));
  vec2 d = (v - head) / R; float dd = dot(d, d);
  if (dd < 1.) n = normalize(mix(n, vec3(d, sqrt(1. - dd)), smoothstep(1., .75, sqrt(dd))));   // his head is a ball
  vec2 ht = tip - head;
  float along = dot(v - head, ht) / max(dot(ht, ht), 1e-4);
  float fade = 1. - smoothstep(.3, 1., along);                      // the tail fades (his shadow)
  fade = max(fade, smoothstep(1.08, .96, sqrt(dd)));                // …never into his head (front view: he stays whole)
  vec4 outc = vec4(0.);
  if (bw > .001) { vec4 w = glassAt(slope(tS, pxS, v, vec3(0., 0., 1.)), bw * .45, vec2(0.), false); outc = w; }
  if (body > .001) { vec4 b = glassAt(n, body * fade, -n.xy * .045, true); outc = b + outc * (1. - b.a); }
  if (fw > .001) { vec4 w = glassAt(slope(tS, pxS, v, vec3(0., 1., 0.)), fw * .7, vec2(0.), false); outc = w + outc * (1. - w.a); }
  gl_FragColor = outc;

  const sh = (t, src) => { const o = gl.createShader(t); gl.shaderSource(o, src); gl.compileShader(o);
    if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(pr); gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const al = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(al); gl.vertexAttribPointer(al, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(pr, n);
  const tex = (unit, name) => { const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.uniform1i(U(name), unit); return t; };

  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true); gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  const mk = () => document.createElement('canvas');
  return { c, gl, top, U, T, mk, M: mk(), chain: [mk(), mk(), mk(), mk(), mk()], I: mk() };
})();

function drawPipGlass(pos, R, t, dt, target, emoji, vis, toYou = 0) {
  const isFace = /^[\u{1F600}-\u{1F64F}\u{1F910}-\u{1F92F}\u{1F970}-\u{1F97A}☺]/u.test(emoji || '');
  const f = step(pos, R, t, dt, target, Math.max(toYou, isFace ? vis : 0));
  const O = f.head, H = proj(O, O, R);
  const tail = rig.tail.map((p, i) => ({ ...proj(p, O, R), r: f.radii[i] }));
  const B = Math.ceil(R * 8), k = dpr, px = Math.round(B * k), x0 = H.x - B / 2, y0 = H.y - B / 2;
  const L = p => ({ x: (p.x - x0) * k, y: (p.y - y0) * k });          // into the box, in pixels

  // 1. the silhouette: body red, front wing green, back wing blue
  const M = GL.M; if (M.width !== px) { M.width = M.height = px; }
  const m = M.getContext('2d'); m.globalCompositeOperation = 'source-over'; m.clearRect(0, 0, px, px);
  m.globalCompositeOperation = 'lighter';
  const hp = L(H);
  m.beginPath(); m.moveTo(hp.x + R * k, hp.y); m.arc(hp.x, hp.y, R * k, 0, Math.PI * 2);
  let prev = { ...hp, r: R * k };
  for (const p of tail) { const q = L(p), r = p.r * R * p.s * k; hull(m, prev, prev.r, q, r); prev = { ...q, r }; }
  m.fillStyle = '#f00'; m.fill('nonzero');
  const wings = f.wings.map(w => {
    const ps = w.pts.map(([p, r]) => ({ ...proj(p, O, R), r, z: p.z - O.z }));
    return { ps, thin: Math.max(.6, Math.abs(w.nrm.z)), z: ps[3].z };
  });
  const backZ = Math.min(...wings.map(w => w.z));
  for (const w of wings) {
    m.beginPath();
    for (let j = 1; j < w.ps.length; j++) {
      const a = L(w.ps[j - 1]), b = L(w.ps[j]);
      const fat = w.z === backZ ? 1 : 1.35;                            // the near wing a little wider (Aaron)
      hull(m, a, Math.max(.6, w.ps[j - 1].r * R * w.ps[j - 1].s * w.thin * k * fat), b, Math.max(.6, w.ps[j].r * R * w.ps[j].s * w.thin * k * fat));
    }
    m.fillStyle = w.z === backZ ? '#00f' : '#0f0'; m.fill('nonzero');
  }
  // 2. softened: shrink by halves (each half averages), the GPU grows them back smoothly
  let src = M;
  GL.chain.forEach((c, i) => { const s2 = Math.max(4, Math.round(src.width / 2)); if (c.width !== s2) c.width = c.height = s2;
    const x = c.getContext('2d'); x.clearRect(0, 0, s2, s2); x.drawImage(src, 0, 0, s2, s2); src = c; });
  const small = GL.chain[3], big = GL.chain[4];                       // ÷16 for the shape (smooth joins), ÷32 for roundness

  // the emoji inside: fills his face, grows from the middle (no sliding up)
  const e = vis * vis * (3 - 2 * vis);
  const I = GL.I, ip = px; if (I.width !== ip) I.width = I.height = ip;
  const ix = I.getContext('2d'); ix.clearRect(0, 0, ip, ip);
  if (emoji && vis > 0) {
    const sz = R * 1.0 * (.5 + .5 * e) * k;
    ix.filter = 'saturate(60%)';                                          // a glass emoji: less colour (Aaron)
    ix.globalAlpha = Math.min(1, vis * 1.5) * .85; ix.font = `${sz}px "Apple Color Emoji","Noto Color Emoji",sans-serif`;
    ix.textAlign = 'center'; ix.textBaseline = 'middle'; ix.fillText(emoji, ip / 2, ip / 2 + R * .08 * k + sz * .06);
    ix.globalAlpha = 1; ix.filter = 'none';
  }

  // 3. the glass shader
  const gl = GL.gl, c = GL.c;
  if (c.width !== px) { c.width = c.height = px; c.style.width = c.style.height = B + 'px'; gl.viewport(0, 0, px, px); }
  c.style.transform = `translate(${x0}px, ${y0}px)`;
  [[0, small], [1, big], [2, I]].forEach(([u, img]) => { gl.activeTexture(gl.TEXTURE0 + u); gl.bindTexture(gl.TEXTURE_2D, GL.T[u]);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img); });
  const uv = p => [(p.x - x0) / B, 1 - (p.y - y0) / B];
  gl.uniform2fv(GL.U('head'), uv(H)); gl.uniform2fv(GL.U('tip'), uv(tail[tail.length - 1]));
  gl.uniform2f(GL.U('pxS'), 1.5 / small.width, 1.5 / small.height); gl.uniform2f(GL.U('pxB'), 1 / big.width, 1 / big.height);
  gl.uniform2f(GL.U('scr'), y0 / Hh, (y0 + B) / Hh); gl.uniform1f(GL.U('R'), R / B);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  // 4. his face on top (placeholder eyes until Aaron draws them). A face emoji takes his face (it sinks into it);
  // any other emoji floats in his body and he keeps his eyes. No mouth unless he's emoting himself (Aaron).
  const tc = GL.top; if (tc.width !== W * dpr) { tc.width = W * dpr; tc.height = Hh * dpr; }
  const fx = tc.getContext('2d'); fx.setTransform(dpr, 0, 0, dpr, 0, 0); fx.clearRect(0, 0, W, Hh);
  const faceOn = isFace ? 1 - e : 1;
  if (faceOn > .02) {
    const eyeLook = window.__eyeLook || { x: 0, y: 0 };
    const onHead = (s2, u) => norm(add(add(f.face, f.sideV, s2), f.up, u));
    const mid = { x: H.x, y: H.y + R * .1 };
    const ee = isFace ? e : 0;
    const sink = p => ({ x: p.x + (mid.x - p.x) * ee + eyeLook.x * R * .07, y: p.y + (mid.y - p.y) * ee + eyeLook.y * R * .05 });
    for (const s2 of [-.3, .3]) {
      const n = onHead(s2, -.32); if (n.z < .05) continue;
      const p = sink(proj(add(O, n), O, R)), kk = 1 - ee * .7;
      fx.save(); fx.globalAlpha = faceOn * Math.min(1, n.z * 4); fx.translate(p.x, p.y); fx.scale(Math.max(.25, n.z) * kk, kk);
      fx.beginPath(); fx.ellipse(0, 0, R * .1, R * .155, 0, 0, Math.PI * 2); fx.fillStyle = GLASS.eye; fx.fill(); fx.restore();
    }
    const mo = onHead(0, -.62);
    if (window.__happy && mo.z > .1) {
      const p = sink(proj(add(O, mo), O, R)), kk = 1 - ee * .7;
      fx.save(); fx.globalAlpha = faceOn * Math.min(1, mo.z * 3); fx.translate(p.x, p.y); fx.scale(Math.max(.3, mo.z) * kk, kk);
      fx.beginPath(); fx.moveTo(-R * .12, 0); fx.quadraticCurveTo(0, R * .1, R * .12, 0);
      fx.lineWidth = R * .05; fx.lineCap = 'round'; fx.strokeStyle = GLASS.eye; fx.stroke(); fx.restore();
    }
  }
  // the glow, on the room (under him)
  const g = ctx.createRadialGradient(H.x, H.y, 0, H.x, H.y, R * 2.3);
  g.addColorStop(0, `rgba(${GLASS.glow},.22)`); g.addColorStop(1, `rgba(${GLASS.glow},0)`);
  ctx.fillStyle = g; ctx.fillRect(H.x - R * 3, H.y - R * 3, R * 6, R * 6);
}

// ---------- the page
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, Hh, dpr; function size() { dpr = devicePixelRatio || 1; W = innerWidth; Hh = innerHeight; cv.width = W * dpr; cv.height = Hh * dpr; }
addEventListener('resize', size); size();
const P = { x: innerWidth / 2, y: innerHeight / 2 }, R = 40;
window.FLAT = location.hash === '#flat';
let drag = null, emoteAt = -1e9, emoji = '', last = 0, auto = true;
cv.addEventListener('pointerdown', e => { drag = { dx: P.x - e.clientX, dy: P.y - e.clientY }; auto = false; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (drag) { P.x = e.clientX + drag.dx; P.y = e.clientY + drag.dy; } });
cv.addEventListener('pointerup', () => { drag = null; });
// curious (Aaron): he looks at what you're doing (your pointer), and glances around when nothing's happening
const look = { x: 0, y: 0, at: -1e9, glance: 0, until: 0 };
addEventListener('pointermove', e => { look.x = e.clientX; look.y = e.clientY; look.at = performance.now() / 1000; });
for (const e of ['⭐', '❤️', '😊', '😂', '✨']) {
  const b = document.createElement('button'); b.textContent = e; b.onclick = () => { emoji = e; emoteAt = performance.now() / 1000; };
  document.getElementById('bar').appendChild(b);
}
const fly = document.createElement('button'); fly.textContent = '▶︎ Fly'; fly.style.fontSize = '15px';
fly.onclick = () => { auto = !auto; }; document.getElementById('bar').appendChild(fly);

window.__frame = (t) => {                     // also used by the headless check (fixed times)
  const dt = last ? Math.min(.05, t - last) : 1 / 60; last = t;
  if (auto) { P.x = W / 2 + Math.sin(t * .5) * W * .28; P.y = Hh / 2 + Math.sin(t * 1.1) * Hh * .12; }
  const since = t - emoteAt;
  const emote = since < 0 ? 0 : since < .3 ? since / .3 : since < 2.8 ? 1 : Math.max(0, 1 - (since - 2.8) / .6);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, Hh);
  ctx.save();
  let target = 0, eye = { x: 0, y: 0 }, toYou = 0;
  if (!drag && t - look.at < 2.5) {                                   // watching you
    const dx = look.x - P.x, dy = look.y - P.y, d = Math.hypot(dx, dy) || 1;
    target = Math.abs(dx) > R ? Math.sign(dx) : 0; eye = { x: dx / d, y: dy / d };
  } else if (!drag) {                                                 // nothing happening: little glances
    if (t > look.until) { look.until = t + 1.2 + Math.random() * 2.5; look.glance = [-1, 0, 1, 2][Math.floor(Math.random() * 4)]; }
    if (look.glance === 2) toYou = .7; else { target = look.glance; eye = { x: look.glance * .8, y: Math.sin(t * .7) * .3 }; }
  }
  window.__eyeLook = eye;
  if (window.FLAT) drawPip(ctx, P, R, t, dt, target, emoji, emote); else drawPipGlass(P, R, t, dt, target, emoji, emote, toYou);
  ctx.restore();
};
window.__set = (o) => Object.assign(window, o);
(function loop(now) { if (!window.__manual) window.__frame(now / 1000); requestAnimationFrame(loop); })(0);
</script>
