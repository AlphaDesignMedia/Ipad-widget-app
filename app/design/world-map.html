<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Pip Works: world map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#efe7d6;--ink:#2a2219;--muted:#76695a;--paper:#f8f1e2;--line:#cdbfa6;--sea:#cfe3e6;--grass:#d9e7c4;--path:#e6d3ae;--g:#2a7f6f;--o:#b4561f;--b:#3c5fa8;--y:#a07a00;--r:#a23b2c;
 --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#17140f;--ink:#efe6d6;--muted:#a99c88;--paper:#211c15;--line:#4a3f30;--sea:#1b2f33;--grass:#26301c;--path:#3a2f1e;--g:#5fd0b8;--o:#f09a62;--b:#8fb0f5;--y:#e9c25a;--r:#ff8a72;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);padding:20px max(12px,env(safe-area-inset-right)) 40px max(12px,env(safe-area-inset-left))}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:14px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,48px);margin:0;letter-spacing:-.02em}
.muted{color:var(--muted);margin:0}
.map{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:8px;overflow:hidden}
svg{width:100%;height:auto;display:block}
svg text{font-family:var(--body);fill:var(--ink)}
.t{font-family:var(--display);font-weight:800;font-size:19px}
.s{font-size:12.5px;fill:var(--muted)}
.e{font-size:30px}
.spot{cursor:pointer}
.spot:hover .card,.spot:focus .card{stroke:var(--o);stroke-width:3}
.spot:focus{outline:none}
.card{fill:var(--paper);stroke:var(--line);stroke-width:2}
#info{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:14px 16px;min-height:76px;display:grid;gap:4px}
#info b{font-family:var(--display);font-size:20px}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--muted)}
.legend span{border:1px solid var(--line);border-radius:999px;padding:3px 10px}
</style></head><body><div class="wrap">
<header><h1>The Pip Works 🗺</h1><p class="muted">Your whole world on one map. Tap a place to see what happens there.</p></header>
<div class="map"><svg viewBox="0 0 1100 700" role="img" aria-label="Map of the Pip Works">
 <rect x="0" y="0" width="1100" height="700" fill="var(--sea)"/>
 <path d="M60 90 Q 120 30 300 50 T 700 40 T 1040 90 Q 1080 260 1050 420 T 1000 650 Q 700 690 420 660 T 70 620 Q 20 420 40 260 Z" fill="var(--grass)" stroke="var(--line)" stroke-width="3"/>
 <!-- paths -->
 <g fill="none" stroke="var(--path)" stroke-width="16" stroke-linecap="round">
  <path d="M250 330 C 380 330 420 330 550 330"/>
  <path d="M550 330 C 680 330 720 330 850 330"/>
  <path d="M550 330 L 550 520"/>
  <path d="M850 330 C 850 430 900 470 900 540"/>
  <path d="M250 330 C 220 420 200 480 190 540"/>
 </g>
 <g fill="none" stroke="var(--o)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round">
  <path d="M250 330 C 380 330 420 330 550 330"/><path d="M550 330 C 680 330 720 330 850 330"/><path d="M850 330 C 850 430 900 470 900 540"/>
 </g>

 <g class="spot" tabindex="0" data-k="yard"><rect class="card" x="140" y="250" width="220" height="150" rx="18"/>
  <text x="160" y="295" class="e">🌳</text><text x="200" y="292" class="t">The Yard</text>
  <text x="160" y="322" class="s">the cloud · Jules, Bob, Dot,</text><text x="160" y="340" class="s">Jean, Chores, Mappy</text><text x="160" y="368" class="s">plugins are made here</text></g>

 <g class="spot" tabindex="0" data-k="board"><rect class="card" x="445" y="250" width="210" height="150" rx="18"/>
  <text x="463" y="295" class="e">📌</text><text x="503" y="292" class="t">Noticeboard</text>
  <text x="463" y="322" class="s">where everyone meets</text><text x="463" y="340" class="s">job sheets · tickets</text><text x="463" y="358" class="s">meeting minutes</text></g>

 <g class="spot" tabindex="0" data-k="workshop"><rect class="card" x="740" y="250" width="230" height="150" rx="18"/>
  <text x="760" y="295" class="e">🏭</text><text x="800" y="292" class="t">The Workshop</text>
  <text x="760" y="322" class="s">your Mac · Robyn 💜, Rob,</text><text x="760" y="340" class="s">Tess 🧪, the Postie 📮</text><text x="760" y="368" class="s">the backbone, and builds</text></g>

 <g class="spot" tabindex="0" data-k="stage"><rect class="card" x="820" y="540" width="190" height="110" rx="18"/>
  <text x="840" y="585" class="e">📱</text><text x="880" y="582" class="t">The Stage</text>
  <text x="840" y="610" class="s">your iPad</text><text x="840" y="628" class="s">paused, your choice</text></g>

 <g class="spot" tabindex="0" data-k="shop"><rect class="card" x="820" y="80" width="190" height="110" rx="18"/>
  <text x="840" y="125" class="e">🏪</text><text x="880" y="122" class="t">The Shop</text>
  <text x="840" y="150" class="s">Glass Clock · locked 🔒</text><text x="840" y="168" class="s">the real product</text></g>

 <g class="spot" tabindex="0" data-k="gate"><rect class="card" x="470" y="80" width="170" height="110" rx="18"/>
  <text x="490" y="125" class="e">🚪</text><text x="530" y="122" class="t">The Gate</text>
  <text x="490" y="150" class="s">only Aaron merges</text><text x="490" y="168" class="s">friends' plugins wait here</text></g>

 <g class="spot" tabindex="0" data-k="kit"><rect class="card" x="460" y="520" width="190" height="120" rx="18"/>
  <text x="480" y="565" class="e">🧰</text><text x="520" y="562" class="t">The Kit</text>
  <text x="480" y="590" class="s">shared parts · rulebook</text><text x="480" y="608" class="s">🔍 the checker (live!)</text></g>

 <g class="spot" tabindex="0" data-k="peter"><rect class="card" x="90" y="520" width="200" height="120" rx="18"/>
  <text x="110" y="565" class="e">🧢</text><text x="150" y="562" class="t">Peter's hut</text>
  <text x="110" y="590" class="s">tea, principles, the Book 📒</text><text x="110" y="608" class="s">Monty 💼 pops in for biscuits</text></g>

 <g class="spot" tabindex="0" data-k="box"><rect class="card" x="110" y="80" width="200" height="110" rx="18" stroke-dasharray="6 6"/>
  <text x="130" y="125" class="e">📦</text><text x="170" y="122" class="t">Pandora's Box</text>
  <text x="130" y="150" class="s">the joke dystopia</text><text x="130" y="168" class="s">firmly shut, we hope</text></g>

 <g class="spot" tabindex="0" data-k="director"><circle cx="550" cy="455" r="34" class="card"/><text x="531" y="468" class="e">🎬</text></g>
 <text x="590" y="462" class="s">Aaron, at the crossroads</text>
</svg></div>
<div id="info" aria-live="polite"><b>Tap a place</b><span class="muted">Each place says who's there and what happens.</span></div>
<div class="legend"><span>· · · the orange path is how a change travels to your iPad</span><span>🔒 the Shop is never touched from here</span><span>🎬 you decide everything</span></div>
</div>
<script>
const info={
 yard:["🌳 The Yard","The cloud, where you talk to Jules. Bob builds carefully, Dot builds quickly, Jean checks every line, Chores tidies, and Mappy keeps the Plugin Map. Plugins are dreamt up and fixed here."],
 board:["📌 The Noticeboard","AGENT-NOTES.md. Job sheets, tickets, meeting minutes and the house style. Nobody has to remember anything, because it's all pinned here."],
 workshop:["🏭 The Workshop","Your Mac. Robyn (she/her) looks after the backbone: Pip, the bars, panels and builds. Rob fixes the slow bits and runs Tess the Tester. The Postie carries plugins to the iPad, and is closed while you're paused."],
 stage:["📱 The Stage","Your iPad. Nothing arrives until it's passed the build check, Tess, and your yes."],
 shop:["🏪 The Shop","Glass Clock, the real product. Locked. Parts only move across one at a time, when you say yes."],
 gate:["🚪 The Gate","Where friends' plugins wait. Jean reads them, Tess tests them, and only you open the gate. Outside plugins start as Experimental."],
 kit:["🧰 The Kit","Shared parts and one rulebook, so fixing one thing fixes every plugin. The checker is live: it reads every plugin on every push and flags timers, internet use, missing VoiceOver labels and missing Keepers."],
 peter:["🧢 Peter's hut","Tea, principles and Peter's Book, where a principle gets bent on purpose, with a date to look again. Monty the investor pops in for biscuits and asks about the business. Neither of them blocks anything. You decide."],
 box:["📦 Pandora's Box","The joke dystopia: Monty in charge, Pip selling biscuits, 1,000 plugins at once. Every joke disaster has a real guard. That's why the rest of the map is a utopia."],
 director:["🎬 Aaron","The director, at the crossroads. You dream it, decide it and set the look. The team does the remembering."]
};
const box=document.getElementById('info');
document.querySelectorAll('.spot').forEach(g=>{const show=()=>{const [t,d]=info[g.dataset.k];box.innerHTML='<b>'+t+'</b><span>'+d+'</span>'};
 g.addEventListener('click',show);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show()}});
 g.setAttribute('role','button');g.setAttribute('aria-label',info[g.dataset.k][0])});
</script></body></html>
