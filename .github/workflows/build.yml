# Builds the Pip Sandbox app on one of GitHub's Macs after every push, so the plugin agent (no Mac)
# finds out straight away if a plugin doesn't compile. No signing: it builds for the Simulator.
name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Build
        working-directory: app
        # Compiler errors are also posted as annotations, which the plugin agent can read without the logs.
        run: |
          set +e
          xcodebuild -project PipSandbox.xcodeproj -target GlassClock -configuration Debug \
            -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO -quiet build > build.log 2>&1
          code=$?
          grep -E ":[0-9]+:[0-9]+: error:" build.log | sort -u | head -40 | while IFS= read -r l; do
            f=${l%%:*}; rest=${l#*:}; line=${rest%%:*}
            echo "::error file=${f#$GITHUB_WORKSPACE/},line=$line::${l#*error: }"
          done
          tail -20 build.log
          exit $code
