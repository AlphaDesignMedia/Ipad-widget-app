# Builds the Pip Sandbox app on one of GitHub's Macs after every push, so the plugin agent (no Mac)
# finds out straight away if a plugin doesn't compile. No signing: it builds for the Simulator.
name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Build
        working-directory: app
        run: |
          xcodebuild -project PipSandbox.xcodeproj -target GlassClock -configuration Debug \
            -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO -quiet build
