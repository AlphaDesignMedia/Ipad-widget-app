# Builds the app on one of GitHub's Macs after every push, so a change that doesn't compile is
# caught before it reaches the iPad. No signing: it builds for the Simulator.
name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Build
        # By target: the project has no shared schemes. The widget is built with it.
        run: |
          xcodebuild -project GlassClock.xcodeproj -target GlassClock -configuration Debug \
            -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO -quiet build
